# Publica as Supabase Edge Functions e grava os segredos delas.
#
# Configuração única no GitHub (Settings > Secrets and variables > Actions):
#   Secrets:
#     SUPABASE_ACCESS_TOKEN  (https://supabase.com/dashboard/account/tokens)
#     SUPABASE_PROJECT_REF   (id do projeto, ex.: abcdefghijklmnop)
#     GEMINI_API_KEY         (IA primária)
#     GROQ_API_KEY           (IA de reserva — https://console.groq.com/keys)
#     VAPID_PRIVATE_KEY      (do par gerado com: npx web-push generate-vapid-keys)
#     CRON_SECRET            (valor longo e aleatório; o MESMO guardado no Vault, ver supabase/cron.sql)
#   Variables:
#     NEXT_PUBLIC_VAPID_PUBLIC_KEY (a mesma do site; vira VAPID_PUBLIC_KEY das funções)
#     VAPID_SUBJECT          (ex.: mailto:voce@exemplo.com)
#   Variables (opcionais):
#     ALLOWED_ORIGINS        (ex.: https://usuario.github.io)
#     GEMINI_MODEL, GROQ_TRANSCRIPTION_MODEL, GROQ_CHAT_MODEL, AI_TIMEOUT_MS, AI_DAILY_LIMIT
#
# As chaves nunca aparecem no log: o GitHub mascara os secrets e elas vão
# para o Supabase por arquivo temporário, não por argumento de linha de comando.
name: Publicar Edge Functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Testes das funções (Node)
        run: node --test "supabase/functions/_shared/*.test.ts"

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Testes das funções (Deno, o mesmo runtime das Edge Functions)
        run: deno test --no-check --config supabase/functions/deno.json supabase/functions/_shared/

      - uses: supabase/setup-cli@v1
        with:
          # Versão fixa: "latest" consulta a API do GitHub e falha quando o limite de
          # consultas estoura ("rate limit exceeded").
          version: 3.1.0

      - name: Gravar segredos
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GROQ_TRANSCRIPTION_MODEL: ${{ vars.GROQ_TRANSCRIPTION_MODEL }}
          GROQ_CHAT_MODEL: ${{ vars.GROQ_CHAT_MODEL }}
          AI_TIMEOUT_MS: ${{ vars.AI_TIMEOUT_MS }}
          AI_DAILY_LIMIT: ${{ vars.AI_DAILY_LIMIT }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VAPID_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
        run: |
          if [ -z "$VAPID_PRIVATE_KEY" ] || [ -z "$VAPID_PUBLIC_KEY" ] || [ -z "$VAPID_SUBJECT" ] || [ -z "$CRON_SECRET" ]; then
            echo "::warning::Faltam VAPID_PRIVATE_KEY/CRON_SECRET (secrets) ou NEXT_PUBLIC_VAPID_PUBLIC_KEY/VAPID_SUBJECT (variables): lembretes por push desligados."
          fi
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning::Falta o segredo GEMINI_API_KEY: só o Groq será usado."
          fi
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::warning::Falta o segredo GROQ_API_KEY: sem reserva quando o Gemini falhar."
          fi
          # O protocolo VAPID exige "mailto:" ou "https:"; aceita só o e-mail e completa.
          case "$VAPID_SUBJECT" in
            mailto:*|https:*) ;;
            *@*) VAPID_SUBJECT="mailto:$VAPID_SUBJECT" ;;
          esac
          if [ -z "$ALLOWED_ORIGINS" ]; then
            ALLOWED_ORIGINS="https://${GITHUB_REPOSITORY_OWNER,,}.github.io"
          fi

          envfile="$(mktemp)"
          trap 'rm -f "$envfile"' EXIT
          for name in GEMINI_API_KEY GROQ_API_KEY ALLOWED_ORIGINS GEMINI_MODEL \
                      GROQ_TRANSCRIPTION_MODEL GROQ_CHAT_MODEL AI_TIMEOUT_MS AI_DAILY_LIMIT \
                      VAPID_PRIVATE_KEY VAPID_PUBLIC_KEY VAPID_SUBJECT CRON_SECRET; do
            value="${!name}"
            if [ -n "$value" ]; then printf '%s=%s\n' "$name" "$value" >> "$envfile"; fi
          done
          # --yes: sem terminal interativo, a CLI exige confirmação explícita.
          supabase secrets set --project-ref "$PROJECT_REF" --env-file "$envfile" --yes

      - name: Publicar funções
        run: |
          supabase functions deploy processar-registro --project-ref "$PROJECT_REF" --use-api --yes
          supabase functions deploy testar-notificacao --project-ref "$PROJECT_REF" --use-api --yes
          supabase functions deploy analisar --project-ref "$PROJECT_REF" --use-api --yes
          # Chamada pelo Supabase Cron, sem usuário: protegida pelo x-cron-secret.
          supabase functions deploy disparar-lembretes --project-ref "$PROJECT_REF" --use-api --no-verify-jwt --yes
          # Marcar dose pela notificação: sem login (autoriza pela assinatura da dose).
          supabase functions deploy marcar-dose --project-ref "$PROJECT_REF" --use-api --no-verify-jwt --yes
