# Cópia de segurança semanal dos dados do Klin (registros, remédios, doses, pressão, perguntas à IA).
# O plano grátis do Supabase não tem cópia que se possa baixar. Todo domingo de madrugada o
# GitHub (na nuvem) lê as tabelas com a chave secreta do Supabase, junta tudo num arquivo
# CRIPTOGRAFADO com a sua senha e guarda como "artefato" da execução por 90 dias (13 cópias).
# Sem a senha, o arquivo é ilegível para qualquer um, mesmo que o repositório seja público.
#
# Segredos (Settings > Secrets and variables > Actions):
#   SUPABASE_SECRET_KEY  Supabase > Project Settings > API Keys > Secret key (sb_secret_...)
#   BACKUP_SENHA         uma senha longa só sua (guarde num lugar seguro: sem ela não dá para abrir)
#
# Para restaurar: node scripts/restaurar-copia.mjs <copia.zip baixado em Actions > Cópia de segurança > Artifacts>
# Para abrir à mão:
#   openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 -in copia.tar.gz.enc -out copia.tar.gz
#   tar -xzf copia.tar.gz        (pede a senha; sai uma pasta "copia" com um .json por tabela)
# Não entram: os áudios do Storage, as inscrições de push e as contas de login.
name: Cópia de segurança

on:
  schedule:
    - cron: "0 7 * * 0"   # domingo, 07:00 UTC = 04:00 em Brasília
  workflow_dispatch:

permissions: {}

concurrency:
  group: copia-seguranca

jobs:
  copia:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SUPABASE_URL: https://oxkjzvhrhmfazaoupnsa.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      BACKUP_SENHA: ${{ secrets.BACKUP_SENHA }}
    steps:
      - name: Confere os segredos
        run: |
          if [ -z "$SUPABASE_SECRET_KEY" ] || [ -z "$BACKUP_SENHA" ]; then
            echo "::error::Faltam os segredos SUPABASE_SECRET_KEY e/ou BACKUP_SENHA (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          if [ ${#BACKUP_SENHA} -lt 12 ]; then
            echo "::error::A BACKUP_SENHA precisa ter pelo menos 12 caracteres."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lê as tabelas
        run: node scripts/copia-seguranca.mjs
      - name: Junta e criptografa
        run: |
          tar -czf copia.tar.gz copia
          openssl enc -aes-256-cbc -pbkdf2 -iter 250000 -salt -in copia.tar.gz -out copia.tar.gz.enc -pass env:BACKUP_SENHA
          # Nada sem criptografia fica para trás.
          rm -rf copia copia.tar.gz
          ls -l copia.tar.gz.enc
      - uses: actions/upload-artifact@v4
        with:
          name: copia-${{ github.run_number }}
          path: copia.tar.gz.enc
          retention-days: 90
          if-no-files-found: error

  # O GitHub desliga agendamentos depois de 60 dias sem commit no repositório.
  # Religar a cada execução evita que a cópia pare sozinha (skill religar-agendamentos).
  religar:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Religa o agendamento da cópia
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/copia-seguranca.yml/enable" && echo "agendamento ativo"
